{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>Delete Car</h1>
  <form method="post" action="{% url 'car-delete' car.pk %}">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ car.name }}"?</p>
    {{ form|crispy }}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'taxi:car-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
